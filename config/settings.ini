; Herramienta Avanzada - Configuracion Centralizada
; Reemplaza 6+ rutas hardcoded en Herramienta Avanzada.bat

[Paths]
; Backup de Drivers
BackupSourceDrivers=%SYSTEMROOT%\System32\Drivers
BackupSourceDriverStore=%SYSTEMROOT%\System32\DriverStore\FileRepository
BackupSourceInf=%SYSTEMROOT%\inf
BackupDest=.\backups\drivers\
LogDir=.\logs\
TempDir=%TEMP%\HerramientaAvanzada\

[Logging]
; Niveles: DEBUG, INFO, WARN, ERROR
Level=INFO
; Dias a retener logs
RetentionDays=30

[Behavior]
EnableDebugLog=false
; Colores (hexadecimal):
; 0A=verde, 0C=rojo, 0E=amarillo
ColorSuccess=0A
ColorError=0C
ColorWarn=0E
